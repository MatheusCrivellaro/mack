<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9ECF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141C" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>Mack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
:root {
  --fundo: #E9ECF0;
  --folha: #FFFFFF;
  --folha-2: #F4F6F8;
  --tinta: #18202E;
  --grafite: #586172;
  --apagado: #8A93A3;
  --linha: #D6DBE2;
  --rubro: #A6192E;
  --rubro-claro: #F6E3E6;
  --verde: #22694C;
  --verde-claro: #E1F0E8;
  --ambar: #9A5B00;
  --ambar-claro: #F8ECD8;
  --sombra-folha: 0 -1px 0 var(--linha), 0 18px 48px rgba(24, 32, 46, .18);
  --raio: 14px;
  --barra: 64px;
  --largura-texto: 72ch;
  --fonte: "Archivo", system-ui, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fundo: #0F141C;
    --folha: #171E29;
    --folha-2: #1D2532;
    --tinta: #E7EBF1;
    --grafite: #A3ACBA;
    --apagado: #6E7888;
    --linha: #283243;
    --rubro: #F06272;
    --rubro-claro: #3A1D24;
    --verde: #5CC497;
    --verde-claro: #16302A;
    --ambar: #E5A54B;
    --ambar-claro: #33281A;
    --sombra-folha: 0 -1px 0 var(--linha), 0 18px 48px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--fundo);
  color: var(--tinta);
  font: 400 16px/1.5 var(--fonte);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--rubro); outline-offset: 2px; border-radius: 6px; }
main:focus, main:focus-visible { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Números e horários: largura condensada, como num quadro de horários. */
.num { font-stretch: 72%; font-weight: 650; letter-spacing: -.01em; }

/* ---------- Estrutura ---------- */
.app { min-height: 100dvh; }
.topo {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background: color-mix(in srgb, var(--fundo) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
}
.topo .quem { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; flex: none;
  background: var(--folha-2) center/cover no-repeat; border: 1px solid var(--linha);
  display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--grafite);
}
.quem-nome { font-weight: 650; font-size: 15px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quem-sub { font-size: 13px; color: var(--grafite); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-sync {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 36px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--linha); background: var(--folha); cursor: pointer; font-size: 13px; color: var(--grafite);
  white-space: nowrap;
}
.btn-sync svg { width: 16px; height: 16px; }
.btn-sync[aria-busy="true"] svg { animation: girar 1s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

main { padding: 4px 16px calc(var(--barra) + env(safe-area-inset-bottom) + 32px); max-width: 1180px; margin: 0 auto; }

.abas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--barra) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--folha); border-top: 1px solid var(--linha);
}
.abas a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  text-decoration: none; font-size: 11.5px; font-weight: 550; color: var(--apagado);
  -webkit-tap-highlight-color: transparent;
}
.abas svg { width: 24px; height: 24px; }
.abas a[aria-current="page"] { color: var(--tinta); }
.abas a[aria-current="page"] svg { color: var(--rubro); }
.lateral { display: none; }

/* ---------- Tipografia de seção ---------- */
.secao { margin-top: 32px; }
.secao > h2, .titulo-secao { font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 12px; }
.titulo-linha { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 12px; }
.titulo-linha h2 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.titulo-linha .lado { font-size: 14px; color: var(--grafite); }
.discreto { color: var(--grafite); }
.pequeno { font-size: 14px; }
.cabecalho-pagina { padding: 18px 0 4px; }
.cabecalho-pagina h1 { font-size: clamp(2rem, 7vw, 2.75rem); font-stretch: 75%; font-weight: 750; letter-spacing: -.02em; line-height: 1; }
.cabecalho-pagina p { margin-top: 8px; color: var(--grafite); max-width: var(--largura-texto); }

/* ---------- Hoje ---------- */
.dia { padding: 14px 0 6px; }
.dia-semana { font-size: 17px; color: var(--grafite); font-weight: 500; }
.dia-data {
  font-size: clamp(3rem, 15vw, 5.5rem); font-stretch: 64%; font-weight: 760;
  line-height: .9; letter-spacing: -.025em; margin-top: 2px;
}
.dia-resumo { margin-top: 14px; font-size: 17px; max-width: 46ch; }

.linha-tempo { list-style: none; margin: 22px 0 0; padding: 0; position: relative; }
.bloco {
  display: grid; grid-template-columns: 64px 1fr; gap: 14px;
  padding: 14px 0; border-top: 1px solid var(--linha); position: relative;
}
.bloco:last-child { border-bottom: 1px solid var(--linha); }
.bloco-hora { line-height: 1.1; }
.bloco-hora .ini { font-size: 26px; }
.bloco-hora .fim { font-size: 15px; color: var(--grafite); font-weight: 500; }
.bloco-corpo { min-width: 0; }
.bloco-titulo {
  display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: pointer;
  font-size: 18px; font-weight: 650; line-height: 1.25;
}
.bloco-onde { color: var(--grafite); font-size: 15px; margin-top: 3px; }
.bloco-extra { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 14px; color: var(--grafite); }
.bloco.passou .bloco-hora, .bloco.passou .bloco-titulo, .bloco.passou .bloco-onde { color: var(--apagado); }
.bloco.agora::before {
  content: ""; position: absolute; left: -16px; top: 0; bottom: 0; width: 4px; background: var(--rubro);
}
.bloco.agora .progresso-aula { height: 3px; background: var(--linha); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.bloco.agora .progresso-aula i { display: block; height: 100%; background: var(--rubro); }
.marca-agora {
  display: flex; align-items: center; gap: 10px; color: var(--rubro); font-weight: 650; font-size: 14px;
  list-style: none; margin: -1px 0; position: relative; z-index: 1;
}
.marca-agora::after { content: ""; flex: 1; height: 2px; background: var(--rubro); }
.marca-agora .num { font-size: 15px; }

.alertas { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.alerta {
  display: grid; grid-template-columns: 4px 1fr; gap: 12px; align-items: stretch;
  background: var(--folha); border-radius: 10px; padding: 12px 14px 12px 0; overflow: hidden;
}
.alerta::before { content: ""; border-radius: 0 3px 3px 0; background: var(--grafite); }
.alerta.critico::before { background: var(--rubro); }
.alerta.atencao::before { background: var(--ambar); }
.alerta p { font-size: 15px; }
.tudo-certo { padding: 14px 16px; background: var(--verde-claro); color: var(--verde); border-radius: 10px; font-weight: 550; }

.duas-colunas { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 48px; }

/* Cartão de faltas: um quadrado por falta permitida. */
.cartao-faltas { display: flex; flex-wrap: wrap; gap: 3px; }
.cartao-faltas i { width: 10px; height: 14px; border-radius: 2px; border: 1.5px solid var(--linha); }
.cartao-faltas i.usada { background: var(--tinta); border-color: var(--tinta); }
.cartao-faltas.alerta-faltas i.usada { background: var(--ambar); border-color: var(--ambar); }
.cartao-faltas.estourou i.usada, .cartao-faltas i.excesso { background: var(--rubro); border-color: var(--rubro); }
.cartao-faltas.grande i { width: 16px; height: 22px; border-radius: 3px; }

.lista-faltas { list-style: none; margin: 0; padding: 0; }
.lista-faltas li {
  display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center;
  padding: 12px 0; border-top: 1px solid var(--linha);
}
.lista-faltas li:last-child { border-bottom: 1px solid var(--linha); }
.lista-faltas button { all: unset; cursor: pointer; font-weight: 600; font-size: 15px; }
.lista-faltas .restam { font-size: 14px; color: var(--grafite); text-align: right; }
.lista-faltas .cartao-faltas { grid-column: 1 / -1; }

.proximas { list-style: none; margin: 0; padding: 0; }
.proximas li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--linha); }
.proximas li:last-child { border-bottom: 1px solid var(--linha); }
.proximas .quando { color: var(--grafite); font-size: 14px; line-height: 1.3; }
.proximas .quando b { display: block; color: var(--tinta); font-size: 15px; font-weight: 600; }

/* ---------- Matérias ---------- */
.materias { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
.materia {
  display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; align-items: center;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--folha); border: 1px solid transparent; border-radius: var(--raio); padding: 16px;
}
.materia:hover { border-color: var(--linha); }
.materia-nome { font-size: 17px; font-weight: 650; line-height: 1.25; }
.materia-notas { display: flex; gap: 16px; margin-top: 6px; font-size: 14px; color: var(--grafite); }
.materia-notas b { color: var(--tinta); font-weight: 650; }
.materia-media { text-align: right; line-height: 1; }
.materia-media .num { font-size: 34px; }
.materia-media small { display: block; font-size: 12px; color: var(--grafite); margin-top: 4px; }
.materia .cartao-faltas { grid-column: 1 / -1; }
.materia-rodape { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; color: var(--grafite); margin-top: -2px; }
.abaixo { color: var(--rubro); }
.acima { color: var(--verde); }

/* ---------- Folha (detalhe) ---------- */
.veu { position: fixed; inset: 0; z-index: 40; background: rgba(15, 20, 28, .38); opacity: 0; pointer-events: none; transition: opacity .2s; }
.veu.aberto { opacity: 1; pointer-events: auto; }
.folha {
  position: fixed; z-index: 50; left: 0; right: 0; bottom: 0;
  max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--folha); border-radius: 20px 20px 0 0; box-shadow: var(--sombra-folha);
  padding: 8px 20px calc(env(safe-area-inset-bottom) + 28px);
  transform: translateY(105%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
  visibility: hidden;
}
.folha.aberta { transform: none; visibility: visible; }
.folha-puxador { width: 40px; height: 5px; border-radius: 3px; background: var(--linha); margin: 4px auto 10px; }
.folha-topo { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.folha-topo h2 { font-size: 24px; font-weight: 720; line-height: 1.15; letter-spacing: -.015em; }
.folha-topo p { color: var(--grafite); font-size: 14px; margin-top: 4px; }
.fechar { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--folha-2); cursor: pointer; display: grid; place-items: center; }
.fechar svg { width: 18px; height: 18px; }

.placar { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: end; margin-top: 22px; }
.placar .grande { font-size: 64px; line-height: .85; }
.placar p { font-size: 16px; max-width: 34ch; }
.etapas { display: grid; gap: 12px; margin-top: 22px; }
.etapa { background: var(--folha-2); border-radius: 12px; padding: 14px 16px; }
.etapa-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.etapa-topo h3 { font-size: 16px; font-weight: 700; }
.etapa-topo .num { font-size: 26px; }
.etapa ul { list-style: none; margin: 8px 0 0; padding: 0; }
.etapa li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14.5px; border-top: 1px solid var(--linha); }
.etapa li span:last-child { white-space: nowrap; }
.etapa .vazio { color: var(--apagado); }
.bloco-detalhe { margin-top: 28px; }
.bloco-detalhe h3 { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
.frase-faltas { font-size: 16px; margin-top: 12px; }
.datas-faltas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding: 0; list-style: none; }
.datas-faltas li { font-size: 13.5px; padding: 4px 10px; border-radius: 999px; background: var(--folha-2); color: var(--grafite); }
.horarios-mini { list-style: none; margin: 0; padding: 0; }
.horarios-mini li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--linha); font-size: 15px; }

/* ---------- Semana ---------- */
.dias-semana { display: flex; gap: 6px; overflow-x: auto; margin: 16px -16px 0; padding: 0 16px 4px; scrollbar-width: none; }
.dias-semana::-webkit-scrollbar { display: none; }
.dias-semana button {
  flex: none; min-width: 56px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--linha);
  background: transparent; cursor: pointer; line-height: 1.15;
}
.dias-semana button .num { display: block; font-size: 22px; }
.dias-semana button small { font-size: 12.5px; color: var(--grafite); }
.dias-semana button[aria-pressed="true"] { background: var(--tinta); color: var(--folha); border-color: var(--tinta); }
.dias-semana button[aria-pressed="true"] small { color: inherit; opacity: .75; }
.dias-semana button.sem-aula { opacity: .55; }
.grade-semana { display: grid; gap: 14px; margin-top: 18px; }
.coluna-dia h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
.coluna-dia h3 small { font-weight: 500; color: var(--grafite); font-size: 13px; }
.coluna-dia.hoje h3 { color: var(--rubro); }
.aula-cartao {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: var(--folha); border: 0; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
}
.aula-cartao .num { font-size: 18px; }
.aula-cartao strong { display: block; font-size: 15.5px; font-weight: 650; margin-top: 2px; line-height: 1.25; }
.aula-cartao span { display: block; font-size: 13.5px; color: var(--grafite); margin-top: 2px; }
.sem-aulas { color: var(--apagado); font-size: 14px; padding: 6px 0; }

/* ---------- Curso ---------- */
.indices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.indice { background: var(--folha); border-radius: var(--raio); padding: 16px; }
.indice .num { font-size: 48px; line-height: .9; display: block; }
.indice span { font-size: 14px; color: var(--grafite); }
.progresso { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
.progresso .rotulo { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; margin-bottom: 6px; }
.progresso .rotulo span:last-child { color: var(--grafite); white-space: nowrap; }
.barra { height: 8px; background: var(--folha); border-radius: 4px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--tinta); border-radius: 4px; }
.etapas-curso { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.etapas-curso details { background: var(--folha); border-radius: 12px; }
.etapas-curso summary {
  list-style: none; cursor: pointer; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
  padding: 14px 16px;
}
.etapas-curso summary::-webkit-details-marker { display: none; }
.etapas-curso summary .num { font-size: 28px; color: var(--grafite); }
.etapas-curso summary strong { font-weight: 650; font-size: 15.5px; display: block; }
.etapas-curso summary small { color: var(--grafite); font-size: 13.5px; }
.etapas-curso summary svg { width: 18px; height: 18px; color: var(--grafite); transition: transform .2s; }
.etapas-curso details[open] summary svg { transform: rotate(180deg); }
.etapas-curso details.atual summary .num { color: var(--rubro); }
.historico { list-style: none; margin: 0; padding: 0 16px 8px; }
.historico li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--linha); }
.historico .nome { font-size: 15px; }
.historico .info { font-size: 13px; color: var(--grafite); }
.historico .nota { text-align: right; font-size: 20px; }
.selo { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--folha-2); color: var(--grafite); }
.selo.ok { background: var(--verde-claro); color: var(--verde); }
.selo.andamento { background: var(--ambar-claro); color: var(--ambar); }
.selo.ruim { background: var(--rubro-claro); color: var(--rubro); }

/* ---------- Secretaria ---------- */
.linhas { list-style: none; margin: 0; padding: 0; background: var(--folha); border-radius: var(--raio); }
.linhas li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--linha); }
.linhas li:first-child { border-top: 0; }
.linhas .principal { font-weight: 600; font-size: 15.5px; }
.linhas .secundario { font-size: 13.5px; color: var(--grafite); }
.linhas .valor { text-align: right; font-size: 20px; }
.vazio-msg { background: var(--folha); border-radius: var(--raio); padding: 16px; color: var(--grafite); }

/* ---------- Conta ---------- */
.conta-perfil { display: flex; gap: 16px; align-items: center; margin-top: 18px; }
.conta-perfil .avatar { width: 72px; height: 72px; font-size: 26px; }
.conta-perfil h2 { font-size: 22px; font-weight: 720; line-height: 1.15; }
.conta-perfil p { color: var(--grafite); font-size: 14.5px; }
.ficha { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 18px 0 0; font-size: 15px; }
.ficha dt { color: var(--grafite); }
.ficha dd { margin: 0; }
.cartao { background: var(--folha); border-radius: var(--raio); padding: 18px; }
.campo { display: grid; gap: 6px; margin-top: 12px; }
.campo label { font-size: 14px; font-weight: 600; }
.campo input {
  font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--linha); background: var(--fundo); color: var(--tinta);
}
.acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.botao {
  min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--linha);
  background: var(--folha); color: var(--tinta); cursor: pointer; font-weight: 600; font-size: 15px;
}
.botao.primario { background: var(--tinta); color: var(--folha); border-color: var(--tinta); }
.botao.perigo { color: var(--rubro); }
.botao:disabled { opacity: .55; cursor: wait; }
.passos { list-style: none; counter-reset: passo; margin: 0; padding: 0; display: grid; gap: 22px; }
.passos > li { counter-increment: passo; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
.passos > li > div, .cartao { min-width: 0; }
.passos > li::before {
  content: counter(passo); font-stretch: 72%; font-weight: 700; font-size: 18px;
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--tinta);
}
.passos h3 { font-size: 16px; font-weight: 700; margin-top: 3px; }
.passos p { color: var(--grafite); font-size: 15px; margin-top: 4px; max-width: 60ch; }
.comando {
  display: flex; align-items: center; gap: 8px; margin-top: 10px;
  background: var(--fundo); border: 1px solid var(--linha); border-radius: 10px; padding: 8px 8px 8px 12px;
}
.comando code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font: 500 13.5px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; scrollbar-width: thin; }
.copiar { flex: none; border: 0; background: var(--folha); border-radius: 8px; min-height: 32px; padding: 0 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
.perguntas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.perguntas button {
  border: 1px solid var(--linha); background: var(--folha); border-radius: 999px; padding: 8px 14px;
  cursor: pointer; font-size: 14.5px; text-align: left;
}
.aviso-skill { margin-top: 18px; font-size: 14px; color: var(--grafite); max-width: 60ch; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--barra) + env(safe-area-inset-bottom) + 16px); z-index: 60;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--tinta); color: var(--folha); padding: 12px 18px; border-radius: 12px; font-size: 15px;
  max-width: calc(100vw - 32px); transition: opacity .2s, transform .2s;
}
.toast.visivel { opacity: 1; transform: translate(-50%, 0); }
.erro-carga { margin-top: 24px; background: var(--rubro-claro); color: var(--rubro); border-radius: var(--raio); padding: 16px; }
a.botao { display: inline-flex; align-items: center; text-decoration: none; }

/* ---------- Site publicado: senha antes dos dados ---------- */
body.trancado .abas, body.trancado .lateral, body.trancado .topo { display: none; }
body.trancado .app { display: block; }
.cadeado { max-width: 380px; margin: 0 auto; padding: 18vh 0 40px; }
.cadeado h1 { font-stretch: 70%; font-weight: 780; font-size: 56px; line-height: 1; letter-spacing: -.02em; }
.cadeado > p { color: var(--grafite); margin-top: 12px; }
.cadeado form { margin-top: 20px; }
.cadeado .botao { width: 100%; justify-content: center; }
.cadeado .erro { color: var(--rubro); font-size: 15px; margin-top: 12px; }

/* ---------- Telas largas ---------- */
@media (min-width: 720px) {
  main { padding-left: 32px; padding-right: 32px; }
  .materias { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .grade-semana { grid-template-columns: repeat(var(--dias, 5), 1fr); }
  .dias-semana { display: none; }
  .coluna-dia[hidden] { display: block; }
  .indices { grid-template-columns: repeat(4, 1fr); }
}
@media (min-width: 1000px) {
  .app { display: grid; grid-template-columns: 248px 1fr; }
  .abas { display: none; }
  .topo .quem { display: none; }
  .topo { justify-content: flex-end; padding-right: 32px; }
  .lateral {
    display: flex; flex-direction: column; gap: 4px;
    position: sticky; top: 0; height: 100dvh; padding: 24px 16px; border-right: 1px solid var(--linha);
  }
  .lateral .marca { font-stretch: 70%; font-weight: 780; font-size: 30px; letter-spacing: -.02em; padding: 0 12px 20px; }
  .lateral a {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
    text-decoration: none; color: var(--grafite); font-weight: 550;
  }
  .lateral a svg { width: 22px; height: 22px; }
  .lateral a:hover { background: var(--folha-2); }
  .lateral a[aria-current="page"] { background: var(--folha); color: var(--tinta); }
  .lateral a[aria-current="page"] svg { color: var(--rubro); }
  .lateral .rodape { margin-top: auto; }
  .lateral .quem { display: flex; gap: 10px; align-items: center; background: none; border: 0; padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left; width: 100%; }
  .lateral .quem:hover { background: var(--folha-2); }
  main { padding-bottom: 48px; }
  .duas-colunas { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
  .folha {
    left: auto; top: 0; width: min(520px, 46vw); max-height: none; height: 100dvh;
    border-radius: 0; padding: 24px 28px 40px; transform: translateX(105%);
  }
  .folha-puxador { display: none; }
  .toast { bottom: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="lateral" aria-label="Seções">
    <div class="marca">Mack</div>
    <div id="nav-lateral"></div>
    <div class="rodape"><button class="quem" id="quem-lateral" data-ir="conta"></button></div>
  </nav>
  <div>
    <header class="topo">
      <button class="quem" id="quem-topo" data-ir="conta" aria-label="Conta, login e Claude"></button>
      <button class="btn-sync" id="btn-sync" type="button"></button>
    </header>
    <main id="conteudo" tabindex="-1"></main>
  </div>
</div>
<nav class="abas" id="abas" aria-label="Seções"></nav>
<div class="veu" id="veu"></div>
<section class="folha" id="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const CHAVE_LOCAL = "mack:chave";
async function chaveDaSenha(senha) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: deB64(COFRE.sal), iterations: COFRE.iteracoes }, base, 256);
  return new Uint8Array(bits);
}
async function abrirCofre(bruta) {
  const chave = await crypto.subtle.importKey("raw", bruta, "AES-GCM", false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: deB64(COFRE.iv) }, chave, deB64(COFRE.dados));
  return JSON.parse(new TextDecoder().decode(claro));
}
const chaveGuardada = () => { try { const s = localStorage.getItem(CHAVE_LOCAL); return s ? deB64(s) : null; } catch { return null; } };
const guardarChave = (b) => { try { localStorage.setItem(CHAVE_LOCAL, paraB64(b)); } catch {} };
const esquecerChave = () => { try { localStorage.removeItem(CHAVE_LOCAL); } catch {} };

function telaCadeado(erro = "") {
  dados = null;
  document.body.classList.add("trancado");
  document.title = "Mack";
  $("conteudo").dataset.secao = "";
  $("conteudo").innerHTML = `<div class="cadeado">
      <h1>Mack</h1>
      <p>Digite a senha do painel. Este aparelho lembra dela depois.</p>
      <form id="form-senha">
        <div class="campo"><label for="senha-site">Senha</label><input id="senha-site" type="password" autocomplete="current-password" required></div>
        <div class="acoes"><button class="botao primario" type="submit">Entrar</button></div>
        ${erro ? `<p class="erro" role="alert">${esc(erro)}</p>` : ""}
      </form>
    </div>`;
  $("senha-site").focus();
}

async function destrancar(senha) {
  try {
    const bruta = senha ? await chaveDaSenha(senha) : chaveGuardada();
    if (!bruta) return telaCadeado();
    dados = await abrirCofre(bruta);
    guardarChave(bruta);
    document.body.classList.remove("trancado");
    render();
  } catch {
    esquecerChave();
    telaCadeado(senha ? "Senha incorreta. Confira e tente de novo." : "");
  }
}

async function api(caminho, opts = {}) {
  const r = await fetch(caminho, { ...opts, headers: { Authorization: "Bearer " + TOKEN, "Content-Type": "application/json" } });
  const corpo = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(corpo.erro || r.statusText);
  return corpo;
}

/* ---------- Formatação ---------- */
const nf = (casas = 2) => new Intl.NumberFormat("pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas });
const nota = (n) => (n === null || n === undefined ? "—" : nf(2).format(n));
const notaCurta = (n) => (n === null || n === undefined ? "—" : nf(1).format(n));
const brl = (v) => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const horas = (v) => nf(0).format(v) + " h";
const dataLocal = (iso) => new Date(iso + "T12:00:00");
const hojeISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const somaDias = (iso, n) => { const d = dataLocal(iso); d.setDate(d.getDate() + n); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const DIAS = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
const DIAS_CURTOS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const diaSemanaLongo = (iso) => dataLocal(iso).toLocaleDateString("pt-BR", { weekday: "long" });
const diaMes = (iso) => dataLocal(iso).toLocaleDateString("pt-BR", { day: "numeric", month: "long" });
const dataCurta = (iso) => dataLocal(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }).replace(".", "");
const mesAno = (iso) => { const s = dataLocal(iso).toLocaleDateString("pt-BR", { month: "long", year: "numeric" }); return s[0].toUpperCase() + s.slice(1); };
const minutos = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const agoraMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const quandoRelativo = (iso) => {
  const dias = Math.round((dataLocal(iso) - dataLocal(hojeISO())) / 864e5);
  if (dias === 0) return "hoje";
  if (dias === 1) return "amanhã";
  if (dias > 1 && dias < 7) return diaSemanaLongo(iso).replace("-feira", "");
  return dataCurta(iso);
};
const relativoHoras = (isoDateTime) => {
  if (!isoDateTime) return "nunca";
  const min = Math.round((Date.now() - new Date(isoDateTime)) / 6e4);
  if (min < 1) return "agora";
  if (min < 60) return `há ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `há ${h} h`;
  const d = Math.round(h / 24);
  return d === 1 ? "ontem" : `há ${d} dias`;
};
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

/* Junta blocos de 50 min seguidos da mesma matéria numa aula só (intervalo de até 20 min). */
function juntarBlocos(itens) {
  const saida = [];
  for (const a of itens) {
    const ult = saida[saida.length - 1];
    if (ult && ult.disciplina_id === a.disciplina_id && ult.data === a.data && ult.dia_semana === a.dia_semana && minutos(a.inicio) - minutos(ult.fim) <= 20) {
      ult.fim = a.fim;
      ult.blocos += 1;
    } else saida.push({ ...a, blocos: 1 });
  }
  return saida;
}
const local = (a) => {
  const sala = (a.sala || "").replace(/^\s*\d+\s*-\s*/, "");
  const predio = (a.predio || "").replace(/^\s*\d+\s*-\s*/, "").replace(/\s*-\s*\d+\s*$/, "");
  return [sala, predio].filter(Boolean).join(", ");
};

/* ---------- Componentes ---------- */
function cartaoFaltas(f, grande = false) {
  if (!f || !f.limite_faltas) return "";
  const usadas = Math.min(f.faltas, f.limite_faltas);
  const excesso = Math.max(f.faltas - f.limite_faltas, 0);
  const cls = f.excedeu_limite ? "estourou" : f.faltas_restantes <= 3 ? "alerta-faltas" : "";
  let q = "";
  for (let i = 0; i < f.limite_faltas; i++) q += `<i class="${i < usadas ? "usada" : ""}"></i>`;
  for (let i = 0; i < excesso; i++) q += '<i class="excesso"></i>';
  return `<div class="cartao-faltas ${cls} ${grande ? "grande" : ""}" role="img" aria-label="${f.faltas} de ${f.limite_faltas} faltas permitidas">${q}</div>`;
}
function fraseFaltas(f) {
  if (!f.aulas_previstas) return "Sem controle de frequência nesta matéria.";
  if (f.excedeu_limite) return `Passou do limite em ${plural(f.faltas - f.limite_faltas, "aula", "aulas")}.`;
  if (f.faltas_restantes === 0) return "Chegou ao limite. Mais uma falta reprova por frequência.";
  return `Pode faltar mais ${plural(f.faltas_restantes, "aula", "aulas")} de ${f.limite_faltas}.`;
}
function fraseNota(d) {
  const s = d.simulacao;
  const min = notaCurta(s.media_minima_aprovacao);
  const pend = d.notas.avaliacoes.filter((a) => a.nota === null).map((a) => a.nome);
  const onde = pend.length ? pend.join(" e ") : "nas avaliações restantes";
  switch (s.situacao) {
    case "possivel": return `Para fechar com ${min}, precisa de ${nota(s.nota_necessaria_media_pendentes)} na ${onde}.`;
    case "ja_aprovado_por_nota": return `Mesmo com zero na ${onde}, a média já chega a ${min}.`;
    case "impossivel_por_nota": return `Não dá mais para chegar a ${min} só com a ${onde}. Restam substitutiva e avaliação final.`;
    case "aprovado": return `Média final ${nota(s.media_final)}. Aprovado por nota.`;
    case "reprovado_por_nota": return `Média final ${nota(s.media_final)}, abaixo de ${min}.`;
    default: return "Nenhuma nota cadastrada ainda.";
  }
}
const classeNota = (n) => (n === null || n === undefined ? "" : n < (dados?.status?.regras?.mediaMinimaAprovacao ?? 6) ? "abaixo" : "");
const aulasDoDia = (iso) => {
  const doPlano = dados.aulas.filter((a) => a.data === iso);
  if (doPlano.length || dados.aulas.length) return juntarBlocos(doPlano);
  const dia = dataLocal(iso).getDay();
  return juntarBlocos(dados.horarios.filter((h) => h.dia_semana === dia).map((h) => ({ ...h, data: iso, disciplina_id: idPorNome(h.disciplina) })));
};
const idPorNome = (nome) => dados.disciplinas.find((d) => d.nome === nome)?.id;
const disciplina = (id) => dados.disciplinas.find((d) => d.id === id);

/* ---------- Hoje ---------- */
function telaHoje() {
  const hoje = hojeISO();
  const aulas = aulasDoDia(hoje);
  const agora = agoraMin();
  let resumo;
  const proxima = aulas.find((a) => minutos(a.fim) > agora);
  if (!aulas.length) {
    const prox = dados.aulas.find((a) => a.data > hoje);
    resumo = prox ? `Sem aula hoje. A próxima é ${prox.disciplina}, ${quandoRelativo(prox.data)} às ${prox.inicio}.` : "Sem aula hoje.";
  } else if (!proxima) {
    resumo = `Aulas de hoje encerradas. ${aulas.length === 1 ? "Foi uma matéria" : `Foram ${aulas.length} matérias`}.`;
  } else if (minutos(proxima.inicio) <= agora) {
    resumo = `${proxima.disciplina} em andamento até ${proxima.fim}${local(proxima) ? `, ${local(proxima)}` : ""}.`;
  } else {
    resumo = `${proxima.disciplina} às ${proxima.inicio}${local(proxima) ? `, ${local(proxima)}` : ""}.`;
  }

  let itens = "";
  let marcou = false;
  for (const a of aulas) {
    const ini = minutos(a.inicio), fim = minutos(a.fim);
    if (!marcou && agora < ini) {
      itens += `<li class="marca-agora"><span>Agora</span><span class="num">${new Date().toTimeString().slice(0, 5)}</span></li>`;
      marcou = true;
    }
    const emCurso = agora >= ini && agora < fim;
    if (emCurso) marcou = true;
    const d = disciplina(a.disciplina_id);
    const prog = emCurso ? Math.round(((agora - ini) / (fim - ini)) * 100) : 0;
    itens += `<li class="bloco ${agora >= fim ? "passou" : ""} ${emCurso ? "agora" : ""}">
      <div class="bloco-hora"><div class="ini num">${a.inicio}</div><div class="fim num">${a.fim}</div></div>
      <div class="bloco-corpo">
        <button class="bloco-titulo" data-materia="${esc(a.disciplina_id)}">${esc(a.disciplina)}</button>
        <div class="bloco-onde">${esc(local(a) || "Local não informado")}</div>
        <div class="bloco-extra">
          <span>${plural(a.blocos, "aula", "aulas")}</span>
          ${d?.faltas?.aulas_previstas ? `<span>${esc(fraseFaltas(d.faltas).replace(/ de \d+\.$/, "."))}</span>` : ""}
        </div>
        ${emCurso ? `<div class="progresso-aula"><i style="width:${prog}%"></i></div>` : ""}
      </div></li>`;
  }

  const alertas = dados.alertas.length
    ? `<ul class="alertas">${dados.alertas.map((a) => `<li class="alerta ${a.nivel}"><p>${esc(a.texto)}</p></li>`).join("")}</ul>`
    : `<p class="tudo-certo">Nada pedindo atenção agora. Faltas, notas e boletos estão em dia.</p>`;

  const comLimite = dados.disciplinas.filter((d) => d.faltas?.limite_faltas).sort((a, b) => a.faltas.faltas_restantes - b.faltas.faltas_restantes);
  const faltas = comLimite.map((d) => `<li>
      <button data-materia="${esc(d.id)}">${esc(d.nome)}</button>
      <span class="restam">${d.faltas.excedeu_limite ? "limite excedido" : `restam <b class="num">${d.faltas.faltas_restantes}</b>`}</span>
      ${cartaoFaltas(d.faltas)}</li>`).join("");

  const amanha = [];
  for (let i = 1; i <= 7 && amanha.length < 4; i++) {
    const dia = somaDias(hoje, i);
    for (const a of aulasDoDia(dia)) amanha.push(a);
  }
  const proximas = amanha.slice(0, 4).map((a) => `<li>
      <div class="quando"><b>${esc(quandoRelativo(a.data || hoje))}</b><span class="num">${a.inicio}</span></div>
      <div><button class="bloco-titulo" style="font-size:15.5px" data-materia="${esc(a.disciplina_id)}">${esc(a.disciplina)}</button><div class="bloco-onde pequeno">${esc(local(a))}</div></div></li>`).join("");

  return `
    <header class="dia">
      <p class="dia-semana">${esc(diaSemanaLongo(hoje))}</p>
      <h1 class="dia-data">${esc(diaMes(hoje))}</h1>
      <p class="dia-resumo">${esc(resumo)}</p>
    </header>
    <div class="duas-colunas">
      <div>
        ${aulas.length ? `<ol class="linha-tempo" aria-label="Aulas de hoje">${itens}</ol>` : ""}
        <section class="secao"><h2>O que pede atenção</h2>${alertas}</section>
      </div>
      <div>
        ${comLimite.length ? `<section class="secao"><div class="titulo-linha"><h2>Faltas que ainda cabem</h2><span class="lado">cada quadrado é uma falta permitida</span></div><ul class="lista-faltas">${faltas}</ul></section>` : ""}
        ${proximas ? `<section class="secao"><h2>Próximas aulas</h2><ul class="proximas">${proximas}</ul></section>` : ""}
      </div>
    </div>`;
}

/* ---------- Matérias ---------- */
function telaMaterias() {
  const lista = dados.disciplinas.map((d) => {
    const ni = d.notas.avaliacoes.map((a) => `<span>${esc(a.nome)} <b class="num ${classeNota(a.nota)}">${nota(a.nota)}</b></span>`).join("");
    const media = d.notas.media_parcial;
    return `<li><button class="materia" data-materia="${esc(d.id)}">
        <div><div class="materia-nome">${esc(d.nome)}</div><div class="materia-notas">${ni || "<span>Sem avaliações</span>"}</div></div>
        <div class="materia-media"><span class="num ${classeNota(media)}">${nota(media)}</span><small>média parcial</small></div>
        ${cartaoFaltas(d.faltas)}
        <div class="materia-rodape"><span>${esc(fraseFaltas(d.faltas))}</span></div>
      </button></li>`;
  }).join("");
  return `
    <header class="cabecalho-pagina">
      <h1>Matérias</h1>
      <p>${plural(dados.disciplinas.length, "matéria", "matérias")} em ${esc(dados.perfil?.periodo_letivo || "curso")}. Toque numa matéria para ver o que compõe cada nota e as datas das faltas.</p>
    </header>
    ${dados.disciplinas.length ? `<ul class="materias">${lista}</ul>` : `<p class="vazio-msg" style="margin-top:16px">Nenhuma matéria ainda. Salve o login do portal em Conta e sincronize.</p>`}`;
}

function folhaMateria(id) {
  const d = disciplina(id);
  if (!d) return "";
  const s = d.simulacao;
  const etapasNota = d.notas.avaliacoes;
  const porEtapa = {};
  for (const c of d.componentes) (porEtapa[c.etapa] ??= []).push(c);
  const etapa = (nome, valor, comps) => `<div class="etapa">
      <div class="etapa-topo"><h3>${esc(nome)}</h3>${valor !== undefined ? `<span class="num ${classeNota(valor)}">${nota(valor)}</span>` : ""}</div>
      ${comps?.length ? `<ul>${comps.map((c) => `<li><span>${esc(c.nome)}</span><span class="${c.nota === null ? "vazio" : "num"}">${c.nota === null ? "sem nota" : `${nota(c.nota)} <span class="discreto">de ${nf(0).format(c.valor ?? 10)}</span>`}</span></li>`).join("")}</ul>` : ""}
    </div>`;
  const nomesNI = new Set(etapasNota.map((a) => a.nome));
  const outras = Object.keys(porEtapa).filter((e) => !nomesNI.has(e));
  const f = d.faltas;
  const datas = (f?.registros || []).reduce((m, r) => (m[r.data] = (m[r.data] || 0) + r.quantidade, m), {});
  const horarios = juntarBlocos(d.horarios.map((h) => ({ ...h, disciplina_id: d.id })));
  const media = d.notas.media_parcial;
  return `
    <div class="folha-puxador"></div>
    <div class="folha-topo">
      <div><h2 id="folha-titulo">${esc(d.nome)}</h2><p>${esc([d.codigo, d.turma && `turma ${d.turma}`].filter(Boolean).join(", "))}</p></div>
      <button class="fechar" data-fechar aria-label="Fechar">${icone("fechar")}</button>
    </div>
    <div class="placar">
      <span class="grande num ${classeNota(media)}">${nota(media)}</span>
      <p>${esc(fraseNota(d))}</p>
    </div>
    <div class="etapas">
      ${etapasNota.map((a) => etapa(a.nome, a.nota, porEtapa[a.nome])).join("")}
      ${outras.map((e) => etapa(e, undefined, porEtapa[e])).join("")}
    </div>
    ${f ? `<div class="bloco-detalhe">
      <h3>Faltas</h3>
      ${cartaoFaltas(f, true)}
      <p class="frase-faltas">${esc(fraseFaltas(f))}${f.aulas_previstas ? ` Frequência atual: <b class="num">${nf(0).format(f.frequencia_atual_pct)}%</b>, mínimo ${nf(0).format(f.frequencia_minima_pct)}%.` : ""}</p>
      ${Object.keys(datas).length ? `<ul class="datas-faltas" aria-label="Datas das faltas">${Object.entries(datas).map(([dt, q]) => `<li>${esc(dataCurta(dt))}${q > 1 ? `, ${q} aulas` : ""}</li>`).join("")}</ul>` : ""}
    </div>` : ""}
    ${horarios.length ? `<div class="bloco-detalhe">
      <h3>Horário</h3>
      <ul class="horarios-mini">${horarios.map((h) => `<li><span>${esc(DIAS[h.dia_semana])}</span><span class="num">${h.inicio} às ${h.fim}</span></li>`).join("")}</ul>
      ${d.proxima_aula ? `<p class="discreto pequeno" style="margin-top:10px">Próxima aula ${esc(quandoRelativo(d.proxima_aula.data))}, às ${esc(d.proxima_aula.inicio)}${local(d.proxima_aula) ? `, ${esc(local(d.proxima_aula))}` : ""}.</p>` : ""}
    </div>` : ""}`;
}

/* ---------- Semana ---------- */
function telaSemana() {
  const hoje = hojeISO();
  const hojeDow = dataLocal(hoje).getDay();
  const segunda = somaDias(hoje, hojeDow === 0 ? 1 : 1 - hojeDow);
  const temSabado = dados.horarios.some((h) => h.dia_semana === 6) || dados.aulas.some((a) => dataLocal(a.data).getDay() === 6);
  const dias = Array.from({ length: temSabado ? 6 : 5 }, (_, i) => somaDias(segunda, i));
  if (!diaSelecionado || !dias.includes(diaSelecionado)) diaSelecionado = dias.includes(hoje) ? hoje : dias[0];

  const botoes = dias.map((iso) => {
    const n = aulasDoDia(iso).length;
    return `<button type="button" data-dia="${iso}" aria-pressed="${iso === diaSelecionado}" class="${n ? "" : "sem-aula"}">
      <small>${DIAS_CURTOS[dataLocal(iso).getDay()]}</small><span class="num">${dataLocal(iso).getDate()}</span></button>`;
  }).join("");
  const colunas = dias.map((iso) => {
    const aulas = aulasDoDia(iso);
    return `<div class="coluna-dia ${iso === hoje ? "hoje" : ""}" ${iso === diaSelecionado ? "" : "hidden"}>
      <h3>${esc(diaSemanaLongo(iso))} <small>${esc(dataCurta(iso))}</small></h3>
      ${aulas.length ? aulas.map((a) => `<button class="aula-cartao" data-materia="${esc(a.disciplina_id)}">
          <span class="num" style="color:var(--tinta);margin:0">${a.inicio} às ${a.fim}</span>
          <strong>${esc(a.disciplina)}</strong><span>${esc(local(a))}</span></button>`).join("") : '<p class="sem-aulas">Sem aulas</p>'}
    </div>`;
  }).join("");

  const futuras = juntarBlocos(dados.aulas.filter((a) => a.data > dias[dias.length - 1]));
  const porData = futuras.reduce((m, a) => ((m[a.data] ??= []).push(a), m), {});
  const agenda = Object.entries(porData).slice(0, 12).map(([dt, as]) => `<li>
      <div class="quando"><b>${esc(dataCurta(dt))}</b>${esc(DIAS[dataLocal(dt).getDay()])}</div>
      <div>${as.map((a) => `<div style="padding:1px 0"><button class="bloco-titulo" style="font-size:15px;display:inline" data-materia="${esc(a.disciplina_id)}">${esc(a.disciplina)}</button> <span class="discreto pequeno num">${a.inicio} às ${a.fim}</span></div>`).join("")}</div></li>`).join("");

  return `
    <header class="cabecalho-pagina">
      <h1>Semana</h1>
      <p>Aulas de ${esc(dataCurta(dias[0]))} a ${esc(dataCurta(dias[dias.length - 1]))}, com sala e horário de cada uma.</p>
    </header>
    <div class="dias-semana" role="group" aria-label="Escolher dia">${botoes}</div>
    <div class="grade-semana" style="--dias:${dias.length}">${colunas}</div>
    ${agenda ? `<section class="secao"><div class="titulo-linha"><h2>Depois desta semana</h2><span class="lado">do plano de aulas</span></div><ul class="proximas">${agenda}</ul></section>` : ""}`;
}

/* ---------- Curso ---------- */
function telaCurso() {
  const c = dados.curso;
  const p = dados.perfil;
  if (!c) return `<header class="cabecalho-pagina"><h1>Curso</h1></header><p class="vazio-msg" style="margin-top:16px">Sincronize com o portal para ver CR, progresso e histórico.</p>`;
  const etapaAtual = Math.min(...c.historico.filter((h) => h.situacao === "Matriculado" || h.situacao === "Cursando").map((h) => h.etapa), Infinity);
  const aprovadasTotal = c.historico.filter((h) => h.situacao === "Aprovado").length;
  const progresso = c.progresso.map((x) => {
    const pct = x.total ? Math.min(100, (x.concluido / x.total) * 100) : 0;
    const fmt = (v) => (x.unidade === "h" ? horas(v) : nf(0).format(v));
    return `<li><div class="rotulo"><span>${esc(x.nome)}</span><span class="num">${fmt(x.concluido)} de ${fmt(x.total)}</span></div><div class="barra"><i style="width:${pct}%"></i></div></li>`;
  }).join("");
  const etapas = {};
  for (const h of c.historico) (etapas[h.etapa] ??= []).push(h);
  const selo = (s) => `<span class="selo ${s === "Aprovado" ? "ok" : /Matric|Cursando/.test(s) ? "andamento" : /Reprov/.test(s) ? "ruim" : ""}">${esc(s === "Matriculado" ? "Cursando" : s)}</span>`;
  const acordeao = Object.entries(etapas).map(([n, itens]) => {
    const ok = itens.filter((i) => i.situacao === "Aprovado").length;
    const cursando = itens.some((i) => /Matric|Cursando/.test(i.situacao));
    const resumo = cursando ? "em curso" : ok === itens.length ? "concluída" : ok ? `${ok} de ${itens.length} aprovadas` : "a cursar";
    return `<li><details class="${Number(n) === etapaAtual ? "atual" : ""}" ${Number(n) === etapaAtual ? "open" : ""}>
      <summary><span class="num" aria-hidden="true">${esc(n)}</span><span><strong>${esc(n)}ª etapa, ${esc(resumo)}</strong><small>${plural(itens.length, "matéria", "matérias")}${itens[0]?.periodo_letivo ? ` em ${esc(itens[0].periodo_letivo)}` : ""}</small></span>${icone("abrir")}</summary>
      <ul class="historico">${itens.map((h) => `<li>
          <span class="nome">${esc(h.disciplina)}</span>
          <span class="nota num ${classeNota(h.nota)}">${h.nota !== null && h.situacao === "Aprovado" ? nota(h.nota) : ""}</span>
          <span class="info">${selo(h.situacao)} ${h.ch ? `${horas(h.ch)}` : ""}${h.periodo_letivo ? `, ${esc(h.periodo_letivo)}` : ""}${h.faltas ? `, ${plural(h.faltas, "falta", "faltas")}` : ""}</span>
        </li>`).join("")}</ul></details></li>`;
  }).join("");
  return `
    <header class="cabecalho-pagina">
      <h1>${esc(p?.curso || "Curso")}</h1>
      <p>${esc([p?.turno, p?.unidade, c.grade && `grade ${c.grade}`].filter(Boolean).join(", "))}</p>
    </header>
    <div class="indices">
      <div class="indice"><span class="num">${nota(c.cr)}</span><span>CR, coeficiente de rendimento</span></div>
      <div class="indice"><span class="num">${nota(c.media_global)}</span><span>média global</span></div>
      <div class="indice"><span class="num">${aprovadasTotal}</span><span>matérias aprovadas</span></div>
      <div class="indice"><span class="num">${Number.isFinite(etapaAtual) ? `${etapaAtual}ª` : "—"}</span><span>etapa atual de ${Object.keys(etapas).length}</span></div>
    </div>
    <section class="secao"><h2>Quanto falta para se formar</h2><ul class="progresso">${progresso}</ul></section>
    <section class="secao"><h2>Histórico por etapa</h2><ul class="etapas-curso">${acordeao}</ul></section>`;
}

/* ---------- Secretaria ---------- */
function telaSecretaria() {
  const boletos = dados.boletos.map((b) => {
    const st = b.status === "pago" ? ["Pago", "ok"] : b.vencido ? ["Vencido", "ruim"] : ["Em aberto", "andamento"];
    const sub = b.status === "pago" ? `vencimento ${dataCurta(b.vencimento)}` : b.vencido ? `venceu ${dataCurta(b.vencimento)}` : `vence ${quandoRelativo(b.vencimento)}`;
    return `<li><span class="principal">${esc(mesAno(b.vencimento))}</span><span class="valor num">${esc(brl(b.valor))}</span>
      <span class="secundario">${esc(sub)}</span><span style="text-align:right"><span class="selo ${st[1]}">${st[0]}</span></span></li>`;
  }).join("");
  const abertos = dados.boletos.filter((b) => b.status !== "pago");
  const bolsas = dados.bolsas.map((b) => `<li><span class="principal">${esc(b.nome)}</span>
      <span class="valor num">${b.tipo === "percentual" ? `${nf(0).format(b.desconto)}%` : esc(brl(b.desconto))}</span>
      <span class="secundario">${esc(b.servico || "")}${b.parcelas ? `, parcelas ${esc(b.parcelas)}` : ""}${b.periodo_letivo ? `, ${esc(b.periodo_letivo)}` : ""}</span>
      <span style="text-align:right"><span class="selo ${b.ativa ? "ok" : ""}">${b.ativa ? "Ativa" : "Inativa"}</span></span></li>`).join("");
  const docs = [...dados.documentos].sort((a, b) => a.entregue - b.entregue).map((d) => `<li>
      <span class="principal">${esc(d.nome)}</span>
      <span style="text-align:right"><span class="selo ${d.entregue ? "ok" : d.obrigatorio ? "ruim" : ""}">${d.entregue ? "Entregue" : "Pendente"}</span></span>
      <span class="secundario">${d.obrigatorio ? "obrigatório" : "opcional"}${d.entregue && d.data_entrega ? `, entregue em ${esc(dataCurta(d.data_entrega))}` : ""}${d.motivo_rejeicao ? `, ${esc(d.motivo_rejeicao)}` : ""}</span><span></span></li>`).join("");
  const pendentes = dados.documentos.filter((d) => !d.entregue);
  return `
    <header class="cabecalho-pagina">
      <h1>Secretaria</h1>
      <p>${abertos.length ? `${plural(abertos.length, "boleto em aberto", "boletos em aberto")}.` : "Nenhum boleto em aberto."} ${pendentes.length ? `${plural(pendentes.length, "documento pendente", "documentos pendentes")}.` : "Documentação completa."}</p>
    </header>
    <section class="secao"><h2>Boletos do período</h2>${boletos ? `<ul class="linhas">${boletos}</ul>` : '<p class="vazio-msg">Nenhum boleto neste período.</p>'}</section>
    ${bolsas ? `<section class="secao"><h2>Bolsas e descontos</h2><ul class="linhas">${bolsas}</ul></section>` : ""}
    ${docs ? `<section class="secao"><h2>Documentos exigidos</h2><ul class="linhas">${docs}</ul></section>` : ""}`;
}

const regrasUsadas = (s) => `Regras usadas nos cálculos: média mínima ${esc(notaCurta(s?.regras?.mediaMinimaAprovacao ?? 6))} e frequência mínima de ${esc(nf(0).format((s?.regras?.frequenciaMinima ?? .75) * 100))}%, conferidas com o portal.`;

    ? `Dados do portal, atualizados ${esc(relativoHoras(s.ultima_sincronizacao))} (${esc(new Date(s.ultima_sincronizacao).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }))}).`

      <div class="cartao">

        <div class="acoes">${agora}<button class="botao" data-acao="sair">Sair deste aparelho</button></div>

/* ---------- Render ---------- */
const TELAS = { hoje: telaHoje, materias: telaMaterias, semana: telaSemana, curso: telaCurso, secretaria: telaSecretaria, conta: telaConta };

function render() {
  const { secao, arg } = rota();
  desenharNav();
  if (!dados) return;
  if (secao === "materia") {
    if (!$("conteudo").dataset.secao) $("conteudo").innerHTML = telaMaterias();
    abrirFolha(arg);
    return;
  }
  fecharFolha(false);
  const tela = TELAS[secao] || telaHoje;
  const mudou = $("conteudo").dataset.secao !== secao;
  $("conteudo").dataset.secao = secao;
  $("conteudo").innerHTML = tela();
  if (mudou) { window.scrollTo(0, 0); $("conteudo").focus({ preventScroll: true }); }
  document.title = `${(SECOES.find(([id]) => id === secao) || ["", "Conta"])[1]}, Mack`;
}

let ultimaTela = "#materias";
function abrirFolha(id) {
  $("folha").innerHTML = folhaMateria(id);
  $("folha").classList.add("aberta");
  $("veu").classList.add("aberto");
  document.body.style.overflow = "hidden";
  $("folha").scrollTop = 0;
  $("folha").querySelector("[data-fechar]")?.focus({ preventScroll: true });
}
function fecharFolha(voltar = true) {
  if (!$("folha").classList.contains("aberta")) return;
  $("folha").classList.remove("aberta");
  $("veu").classList.remove("aberto");
  document.body.style.overflow = "";
  if (voltar) location.hash = ultimaTela;
}

let toastTimer;
function toast(msg) {
  $("toast").textContent = msg;
  $("toast").classList.add("visivel");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("visivel"), 3200);
}

async function carregar() {
  if (ESTATICO) return destrancar();
  try {
    [dados, credenciais] = await Promise.all([api("/api/painel"), api("/api/credenciais")]);
    render();
  } catch (e) {
    $("conteudo").innerHTML = `<p class="erro-carga">Não foi possível ler os dados do servidor: ${esc(e.message)}. Confira se o painel está rodando (npm start) e recarregue a página.</p>`;
  }
}

async function sincronizar() {
  if (sincronizando) return;
  if (ESTATICO) { ir("conta"); return; }
  if (!credenciais.configurado) { toast("Salve o login do portal antes de sincronizar."); ir("conta"); return; }
  sincronizando = true;
  desenharSync();
  document.querySelectorAll('[data-acao="sincronizar"]').forEach((b) => { b.disabled = true; b.textContent = "Sincronizando…"; });
  try {
    await api("/api/sync", { method: "POST" });
    toast("Dados atualizados com o portal.");
  } catch (e) {
    toast("A sincronização falhou: " + e.message);
  } finally {
    sincronizando = false;
    await carregar();
  }
}

/* ---------- Eventos ---------- */
document.addEventListener("click", async (e) => {
  const alvo = e.target.closest("[data-materia],[data-ir],[data-fechar],[data-dia],[data-copiar],[data-acao]");
  if (!alvo) return;
  if (alvo.dataset.materia) {
    if (rota().secao !== "materia") ultimaTela = location.hash || "#hoje";
    location.hash = "#materia/" + encodeURIComponent(alvo.dataset.materia);
  } else if (alvo.dataset.ir) ir(alvo.dataset.ir);
  else if ("fechar" in alvo.dataset) fecharFolha();
  else if (alvo.dataset.dia) { diaSelecionado = alvo.dataset.dia; render(); }
  else if (alvo.dataset.copiar) {
    try { await navigator.clipboard.writeText(alvo.dataset.copiar); toast("Copiado."); }
    catch { toast("Não deu para copiar. Selecione o texto e copie manualmente."); }
  } else if (alvo.dataset.acao === "sincronizar") sincronizar();
  else if (alvo.dataset.acao === "sair") { esquecerChave(); location.hash = ""; telaCadeado(); }
  else if (alvo.dataset.acao === "trocar-login") { $("form-login").hidden = false; $("cred-user").focus(); }
  else if (alvo.dataset.acao === "remover-login") {
    await api("/api/credenciais", { method: "DELETE" });
    credenciais = { configurado: false };
    toast("Login removido deste computador.");
    render();
  }
});
document.addEventListener("submit", async (e) => {
  if (e.target.id === "form-senha") {
    e.preventDefault();
    e.target.querySelector("button[type=submit]").disabled = true;
    await destrancar($("senha-site").value);
    return;
  }
  if (e.target.id !== "form-login") return;
  e.preventDefault();
  const botao = e.target.querySelector("button[type=submit]");
  botao.disabled = true;
  try {
    credenciais = await api("/api/credenciais", { method: "POST", body: JSON.stringify({ usuario: $("cred-user").value, senha: $("cred-pass").value }) });
    toast("Login salvo. Sincronize para trazer seus dados.");
    render();
  } catch (err) {
    toast("Não foi possível salvar: " + err.message);
    botao.disabled = false;
  }
});
$("btn-sync").addEventListener("click", sincronizar);
$("veu").addEventListener("click", () => fecharFolha());
document.addEventListener("keydown", (e) => { if (e.key === "Escape") fecharFolha(); });
window.addEventListener("hashchange", render);

/* Arrastar a folha para baixo fecha (celular). */
let toqueY = null;
$("folha").addEventListener("touchstart", (e) => { toqueY = $("folha").scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
$("folha").addEventListener("touchmove", (e) => {
  if (toqueY === null) return;
  const dy = e.touches[0].clientY - toqueY;
  if (dy > 0) $("folha").style.transform = `translateY(${dy}px)`;
}, { passive: true });
$("folha").addEventListener("touchend", (e) => {
  if (toqueY === null) return;
  const dy = e.changedTouches[0].clientY - toqueY;
  $("folha").style.transform = "";
  toqueY = null;
  if (dy > 110) fecharFolha();
});

/* Atualiza a linha do "agora" a cada minuto. */
